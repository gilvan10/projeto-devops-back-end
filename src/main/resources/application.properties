spring.application.name=projeto-devops-back-end

spring.datasource.url=jdbc:postgresql://localhost:5432/projeto_devops_back_end
spring.datasource.username=postgres
spring.datasource.password=123456
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.baseline-on-migrate = true

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

aws.region=${AWS_REGION:us-east-1}
aws.bucket.name=${AWS_BUCKET_NAME:divulgacao-servicos-gilvan-arquivos}
admin.key=${ADMIN_KEY:admin}