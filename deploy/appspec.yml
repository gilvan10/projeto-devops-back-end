version: 0.0
os: linux

file_exists_behavior: OVERWRITE   #substitui o arquivo quando existir .jar

files:
  - source: projeto-devops-back-end.jar      #Caminho do JAR dentro do artefato/zip
    destination: /opt/projeto-devops-back-end    #Pasta destino na EC2

hooks:
  ApplicationStop:
    - location: scripts/application_stop.sh
      timeout: 60
      runas: root

  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 60
      runas: root

  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 120
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 60
      runas: root