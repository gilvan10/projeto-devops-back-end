version: 0.2

env:
  variables:
    APP_NAME: "projeto-devops-back-end"
    JAR_NAME: "projeto-devops-back-end.jar"
    APP_DIR: "/opt/projeto-devops-back-end"

  secrets-manager:
    URL_DATABASE: "projeto-devops-back-end/prod:URL_DATABASE"
    DB_USERNAME: "projeto-devops-back-end/prod:DB_USERNAME"
    DB_PASSWORD: "projeto-devops-back-end/prod:DB_PASSWORD"
    AWS_BUCKET_NAME: "projeto-devops-back-end/prod:AWS_BUCKET_NAME"

phases:

  install:
    runtime-versions:
      java: corretto21

  pre_build:
    commands:
      - echo "========================================="
      - echo "INFORMAÇÕES DO AMBIENTE"
      - echo "========================================="
      - java -version
      - chmod +x mvnw
      - ./mvnw -version
      - 'test -n "$AWS_BUCKET_NAME" && echo "AWS_BUCKET_NAME definida" || echo "ERRO: AWS_BUCKET_NAME não definida"'

  build:
    commands:
      - echo "========================================="
      - echo "EXECUTANDO TESTES E BUILD"
      - echo "========================================="
      - ./mvnw clean package

  post_build:
    commands:
      - echo "========================================="
      - echo "PREPARANDO ARTEFATO PARA CODEDEPLOY"
      - echo "========================================="

      - echo "Arquivos gerados pelo Maven:"
      - ls -lah target/

      - mkdir -p deploy-artifact/target

      - cp target/*.jar deploy-artifact/target/${JAR_NAME}

      - cp deploy/appspec.yml deploy-artifact/

      - cp -r deploy/scripts deploy-artifact/

      - echo "===== COMMIT ====="
      - git rev-parse HEAD
      - echo "===== JAR ====="
      - ls -lh target/projeto-devops-back-end.jar
      - sha256sum target/projeto-devops-back-end.jar

      - echo "========================================="
      - echo "ESTRUTURA FINAL DO ARTEFATO"
      - echo "========================================="

      - find deploy-artifact -type f -print

      - echo "Build finalizado em $(date)"

artifacts:
  base-directory: deploy-artifact
  files:
    - "**/*"
  discard-paths: no